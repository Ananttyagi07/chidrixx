{{- if and .Values.auth.generate (not .Values.auth.adminPasswordSecretName) }}
{{- $secretName := printf "%s-admin-password" (include "chidrixx-controlplane.fullname" .) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $password := "" }}
{{- if $existing }}
{{- $password = index $existing.data .Values.auth.adminPasswordSecretKey | b64dec }}
{{- else }}
{{- $password = randAlphaNum 32 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "chidrixx-controlplane.labels" . | nindent 4 }}
  annotations:
    # helm diff/lint on a `lookup`-derived value can otherwise show a
    # spurious change every render; this is here for humans reading the
    # object, not read by the chart itself.
    chidrixx.dev/generated: "true"
type: Opaque
data:
  {{ .Values.auth.adminPasswordSecretKey }}: {{ $password | b64enc }}
{{- end }}
