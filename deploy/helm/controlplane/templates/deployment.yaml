apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "chidrixx-controlplane.fullname" . }}
  labels:
    {{- include "chidrixx-controlplane.labels" . | nindent 4 }}
spec:
  # SQLite is single-writer — this must never be scaled beyond 1 replica
  # without moving the store to something server-based first.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: chidrixx-controlplane
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chidrixx-controlplane
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: controlplane
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - -addr=:{{ .Values.service.port }}
            - -db=/data/controlplane.db
          env:
            - name: CHIDRIXX_ADMIN_USER
              value: {{ .Values.auth.adminUser | quote }}
          {{- $pwSecret := include "chidrixx-controlplane.adminPasswordSecretName" . }}
          {{- if $pwSecret }}
            - name: CHIDRIXX_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $pwSecret }}
                  key: {{ .Values.auth.adminPasswordSecretKey }}
          {{- end }}
          {{- if .Values.groq.apiKeySecretName }}
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.groq.apiKeySecretName }}
                  key: {{ .Values.groq.apiKeySecretKey }}
          {{- end }}
          {{- if .Values.groq.model }}
            - name: GROQ_MODEL
              value: {{ .Values.groq.model | quote }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 2
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "chidrixx-controlplane.fullname" . }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
