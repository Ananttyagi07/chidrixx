image:
  repository: ghcr.io/ananttyagi07/chidrixx-controlplane
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8090

# The real Groq-backed chat assistant / anomaly narrator (controlplane/
# groq.go). Optional: unset means those features honestly 503 rather
# than the control plane failing to start. Same pattern as
# auth.adminPasswordSecretName -- a credential doesn't belong in a plain
# Helm value, so this only ever references a secret you create yourself:
#   kubectl create secret generic <name> --from-literal=apiKey=<your key>
groq:
  apiKeySecretName: ""
  apiKeySecretKey: "apiKey"
  model: "" # optional override, e.g. llama-3.3-70b-versatile (the binary's own default)

# The SQLite store needs to survive pod restarts/rescheduling — a single
# ReadWriteOnce volume is enough since this runs as one replica (SQLite is
# single-writer; don't scale this beyond 1 without moving to a real
# server-based store first).
persistence:
  enabled: true
  size: 2Gi
  storageClassName: ""

# Auth (see controlplane/tenant.go, auth.go). Real multi-tenant login —
# no more single shared Basic Auth token. On first boot (no tenants in the
# database yet), the control plane bootstraps one tenant with one admin
# user, username from adminUser below, password from the generated secret
# unless adminPasswordSecretName is set to one you manage yourself. Fetch
# the generated password with:
#   kubectl get secret -n <namespace> <release>-controlplane-admin-password \
#     -o jsonpath='{.data.password}' | base64 -d
# (also printed in `helm install`/`helm upgrade` NOTES, and once in the pod
# logs on first boot alongside the tenant's agent ingest token — the ingest
# token is generated server-side and only ever shown that one time, so
# capture it from `kubectl logs` right after first install).
#
# Provisioning additional tenants is an operator action, not a web
# form — run `kubectl exec` into the pod and use the `create-tenant` /
# `create-user` CLI subcommands (see PROJECT_STATUS.md).
#
# Set generate=false (with adminPasswordSecretName still empty) to skip
# the chart managing a K8s Secret at all — the control plane binary itself
# still always bootstraps a real admin account either way; without a
# CHIDRIXX_ADMIN_PASSWORD env var it generates its own random password and
# logs it once. There's no "unauthenticated" mode anymore now that real
# accounts exist — that gap the old shared-token model still had is closed.
auth:
  adminUser: "admin"
  adminPasswordSecretName: ""
  adminPasswordSecretKey: "password"
  generate: true

resources: {}

# Expose the dashboard/API outside the cluster. Basic Auth over plain HTTP
# is fine on a trusted internal network (see auth.tokenSecretName above)
# but not over the open internet — set tls.enabled with a cert-manager
# annotation (or a pre-existing secretName) so credentials aren't sent in
# the clear.
ingress:
  enabled: false
  className: "traefik"
  host: ""
  annotations: {}
  tls:
    enabled: false
    # Name of a pre-existing TLS secret, or the name cert-manager should
    # write to if annotations request a certificate (e.g.
    # cert-manager.io/cluster-issuer: letsencrypt-prod).
    secretName: ""
