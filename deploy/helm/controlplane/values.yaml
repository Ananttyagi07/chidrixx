image:
  repository: ghcr.io/ananttyagi07/chidrixx-controlplane
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8090

# The SQLite store needs to survive pod restarts/rescheduling — a single
# ReadWriteOnce volume is enough since this runs as one replica (SQLite is
# single-writer; don't scale this beyond 1 without moving to a real
# server-based store first).
persistence:
  enabled: true
  size: 2Gi
  storageClassName: ""

# Auth (see controlplane/auth.go). Token is a secret, not a plain value:
# create it yourself
# (`kubectl create secret generic chidrixx-controlplane-token
#  --from-literal=token=...`) and reference it here. Leave tokenSecretName
# empty to run unauthenticated — fine for a quick local trial, not for
# anything reachable beyond a trusted network.
auth:
  tokenSecretName: ""
  tokenSecretKey: "token"

resources: {}

# Expose the dashboard/API outside the cluster. Basic Auth over plain HTTP
# is fine on a trusted internal network (see auth.tokenSecretName above)
# but not over the open internet — set tls.enabled with a cert-manager
# annotation (or a pre-existing secretName) so credentials aren't sent in
# the clear.
ingress:
  enabled: false
  className: "traefik"
  host: ""
  annotations: {}
  tls:
    enabled: false
    # Name of a pre-existing TLS secret, or the name cert-manager should
    # write to if annotations request a certificate (e.g.
    # cert-manager.io/cluster-issuer: letsencrypt-prod).
    secretName: ""
