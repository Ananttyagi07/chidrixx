image:
  repository: ghcr.io/ananttyagi07/chidrixx-controlplane
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8090

# The SQLite store needs to survive pod restarts/rescheduling — a single
# ReadWriteOnce volume is enough since this runs as one replica (SQLite is
# single-writer; don't scale this beyond 1 without moving to a real
# server-based store first).
persistence:
  enabled: true
  size: 2Gi
  storageClassName: ""

# Auth (see controlplane/auth.go). Secure by default: if tokenSecretName is
# left empty and generate=true, the chart creates and manages its own
# random token secret (kept stable across upgrades via a `lookup` check —
# it only generates once, never rotates one it finds). Fetch it for the
# agent side with:
#   kubectl get secret -n <namespace> <release>-controlplane-auth-token \
#     -o jsonpath='{.data.token}' | base64 -d
# (also printed in `helm install`/`helm upgrade` NOTES).
#
# There is no way to auto-sync this to the kharcha agent's Helm release
# automatically — they're independent releases, possibly in different
# clusters, with no shared secret store between them. That one copy step
# is still manual; this only removes the "come up with your own token and
# create both secrets by hand" step.
#
# Set generate=false (with tokenSecretName still empty) to run fully
# unauthenticated instead — fine for a quick local trial, not for anything
# reachable beyond a trusted network. Set tokenSecretName to use a secret
# you manage yourself instead of the generated one.
auth:
  tokenSecretName: ""
  tokenSecretKey: "token"
  generate: true

resources: {}

# Expose the dashboard/API outside the cluster. Basic Auth over plain HTTP
# is fine on a trusted internal network (see auth.tokenSecretName above)
# but not over the open internet — set tls.enabled with a cert-manager
# annotation (or a pre-existing secretName) so credentials aren't sent in
# the clear.
ingress:
  enabled: false
  className: "traefik"
  host: ""
  annotations: {}
  tls:
    enabled: false
    # Name of a pre-existing TLS secret, or the name cert-manager should
    # write to if annotations request a certificate (e.g.
    # cert-manager.io/cluster-issuer: letsencrypt-prod).
    secretName: ""
