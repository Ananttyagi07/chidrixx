apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "kharcha.fullname" . }}
  labels:
    {{- include "kharcha.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: kharcha
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kharcha
        app.kubernetes.io/instance: {{ .Release.Name }}
      {{- /* Resolved via a local with a default, not direct traversal: an
             existing release upgraded with --reuse-values has no
             .Values.metrics at all. See prometheusrule.yaml's comment.
             hasKey so an explicit `false` is honoured while an absent key
             still defaults to on. */ -}}
      {{- $metrics := .Values.metrics | default dict }}
      {{- if or (not (hasKey $metrics "scrapeAnnotations")) $metrics.scrapeAnnotations }}
      # The agent already serves /metrics, but nothing was telling
      # Prometheus to read it -- without this, the shipped alert on
      # kharcha_map_utilization_ratio would silently never evaluate.
      # These are the widely-used annotation conventions; they are inert
      # metadata on a cluster whose Prometheus doesn't consult them, so
      # they are on by default and harmless if unused.
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.metricsPort | quote }}
        prometheus.io/path: "/metrics"
      {{- end }}
    spec:
      serviceAccountName: {{ include "kharcha.fullname" . }}
      containers:
        - name: agent
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - -bpf-object=/app/bpf/flow_cgroup.o
            - -pricebook=/etc/kharcha/pricebook.yaml
            - -html-out=/app/report.html
            - -metrics-addr=:{{ .Values.metricsPort }}
            - -k8s-refresh-interval={{ .Values.k8sRefreshInterval }}
            - -node-has-public-ip={{ .Values.nodeHasPublicIP }}
            - -managed-cidrs={{ .Values.managedCIDRs }}
            - -alert-threshold-inr={{ .Values.alerting.thresholdINR }}
            - -alert-growth-ratio={{ .Values.alerting.growthRatio }}
            {{- if .Values.alerting.webhookSecretName }}
            - -alert-webhook=$(ALERT_WEBHOOK_URL)
            {{- end }}
            {{- if .Values.controlPlane.url }}
            - -controlplane-url={{ .Values.controlPlane.url }}
            - -cluster-id={{ .Values.controlPlane.clusterID | default .Release.Namespace }}
            {{- end }}
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            {{- if .Values.alerting.webhookSecretName }}
            - name: ALERT_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.alerting.webhookSecretName }}
                  key: {{ .Values.alerting.webhookSecretKey }}
            {{- end }}
            {{- if .Values.controlPlane.tokenSecretName }}
            - name: CHIDRIXX_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.controlPlane.tokenSecretName }}
                  key: {{ .Values.controlPlane.tokenSecretKey }}
            {{- end }}
          securityContext:
            privileged: {{ .Values.privileged }}
          ports:
            - name: metrics
              containerPort: {{ .Values.metricsPort }}
          volumeMounts:
            - name: cgroup
              mountPath: /sys/fs/cgroup
            - name: pricebook
              mountPath: /etc/kharcha
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: cgroup
          hostPath:
            path: /sys/fs/cgroup
        - name: pricebook
          configMap:
            name: {{ include "kharcha.fullname" . }}-pricebook
